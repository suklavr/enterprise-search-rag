[project]
name = "enterprise-search-rag"
version = "0.1.0"
description = "Hybrid (dense + sparse) enterprise search RAG demo with cited answers: Pinecone + OpenAI, or fully local."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.50",
  "pinecone>=5",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools]
packages = ["rag"]
